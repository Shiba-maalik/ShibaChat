name: itr
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  permission_handler: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  youtube_player_flutter: ^10.0.1
  geolocator: ^14.0.1
  url_launcher: ^6.3.1
  flutter_webrtc: ^1.6.2+hotfix.3
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_contacts: ^2.5.0
  scratcher: ^2.5.0
  local_auth: ^3.0.2
  audioplayers: ^6.1.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21

